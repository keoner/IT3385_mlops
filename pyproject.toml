[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "it3385_mlops"
version = "0.0.1"
description = "IT3385 Assignment 1"
authors = [
  { name = "Keoni" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
    "hydra-core (>=1.3.4,<2.0.0)",
    "dvc (>=3.67.1,<4.0.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "streamlit (>=1.61.1,<2.0.0)",
]
requires-python = ">=3.10,<3.13"
[tool.ruff]
line-length = 99
src = ["it3385_mlops"]
include = ["pyproject.toml", "it3385_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["it3385_mlops"]
force-sort-within-sections = true

[tool.poetry]
package-mode = false
