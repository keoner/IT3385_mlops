[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "it3385_mlops"
version = "0.0.1"
description = "IT3385 Assignment 1"
authors = [
  { name = "Keoni" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
    "hydra-core (>=1.3.4,<2.0.0)",
    "dvc[gdrive] (>=3.67.1,<4.0.0)",
    "pyopenssl (>=23.2.0,<26.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pycaret (>=3.3.2,<4.0.0)",
    "numpy (==1.26.4)",
    "scipy (==1.11.4)",
    "scikit-learn (==1.4.2)",
    "mlflow (==2.17.2)",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["it3385_mlops"]
include = ["pyproject.toml", "it3385_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["it3385_mlops"]
force-sort-within-sections = true


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.3.0"

